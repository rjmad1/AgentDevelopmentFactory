site_name: Agent Development Factory
site_description: Meta-product transforming workflow briefs into inspectable, portable, safe, and verifiable Agent Build Packs.
site_author: Raja Jeevan Kumar Maduri
repo_name: rjmad1/AgentDevelopmentFactory
repo_url: https://github.com/rjmad1/AgentDevelopmentFactory
site_url: https://rjmad1.github.io/AgentDevelopmentFactory/
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Product Contracts & SDD:
      - Capability Roadmap: ROADMAP.md
      - Product Contract: factory_product_contract.md
      - Capability & Acceptance Map: factory_capability_and_acceptance_map.md
      - Persona Opportunity Map: factory_persona_opportunity_map.md
      - Paper Interaction Walkthrough: factory_paper_interaction_walkthrough.md
      - Development Pipeline Playbook: DEVELOPMENT_PIPELINE.md
      - Autonomous Engineering Loop: AUTONOMOUS_LOOP.md
  - Platform Architecture:
      - Master Architecture: architecture/master.md
      - Three-Plane Model: architecture/three_plane.md
      - Component Architecture: architecture/components.md
      - Evaluation Framework: architecture/evaluations.md
      - Security & Policies: architecture/security.md
  - Verification & CI/CD:
      - Zero-Cost CI/CD Pipeline: verification/pipeline.md
      - Deep Evaluator & Gates: verification/deep_evaluator.md
      - LangSmith Free Tier Telemetry: verification/langsmith.md
  - API Reference:
      - Authoring Core Engine (JS): api/core.md
      - CLI Reference: api/cli.md
      - Control Plane (Python): api/control_plane.md
      - Specifications & Schema: api/specs.md
      - Workbench: api/workbench.md
      - Evaluations & Graders: api/evals.md
      - Runtime & Process: api/runtime.md
      - Security & Redaction: api/security.md
      - Registry & Discovery: api/registry.md
      - Provider Adapters: api/adapters.md
  - Guides & Operations:
      - Getting Started: guides/getting_started.md
      - Operations Runbook: guides/operations.md
      - Recovery Runbook: guides/recovery.md
