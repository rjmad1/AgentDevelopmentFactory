global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'adf-control-plane'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['adf-server:3000']
        labels:
          component: 'control-plane'
          service: 'adf-server'

  - job_name: 'adf-worker-pool'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['adf-worker:8000']
        labels:
          component: 'reasoning-worker'
          service: 'adf-worker'
